<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Table Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .main-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 25px;
    }

    h1 {
      color: #0f172a;
      font-size: 28px;
    }

    .header-datetime {
      font-size: 18px;
      font-weight: 700;
      color: #334155;
      background: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid #000000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .section-title {
      width: 100%;
      max-width: 1600px;
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin: 20px 0 15px 0;
      text-transform: uppercase;
      border-bottom: 3px solid #64748b;
      padding-bottom: 5px;
    }

    /* Container layout for tables */
    .tables-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 1600px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      background: #ffffff;
      border: 2px solid #000000;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      margin: 0 auto;
      position: relative;
    }

    .card.locked {
      background-color: #e2e8f0;
    }

    /* Top Header */
    .top-header {
      background-color: #000000;
      color: #ffff00;
      text-align: center;
      padding: 12px 15px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lock-btn {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      padding: 2px 8px;
      transition: transform 0.1s ease;
    }

    .lock-btn:active {
      transform: scale(0.95);
    }

    /* Subtitle Box */
    .subtitle-box {
      background-color: #fff2c6;
      color: #000000;
      text-align: center;
      padding: 25px 15px;
      font-size: 24px;
      font-weight: 800;
      border-bottom: 2px solid #000000;
    }

    /* Table Grid Layout */
    .table-grid {
      display: grid;
      grid-template-columns: 130px 1fr;
      border-collapse: collapse;
    }

    .grid-cell {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      font-size: 19px;
      font-weight: 700;
      color: #000000;
      border-bottom: 2px solid #000000;
      border-right: 2px solid #000000;
      min-height: 58px;
    }

    .grid-cell:nth-child(2n) {
      border-right: none;
    }

    /* Alternating Row Colors */
    .row-dark {
      background-color: #a0a0a0;
    }

    .row-light {
      background-color: #f2f2f2;
    }

    /* Input & Select Custom Styling */
    .pill-select {
      width: 100%;
      padding: 8px 14px;
      border-radius: 25px;
      font-size: 19px;
      font-weight: 800;
      border: none;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
      text-align-last: center;
    }

    .pill-select:disabled, .text-input:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Select Pill Variations */
    .pill-red {
      background-color: #ffcccc;
      color: #990000;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%7B0000'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    }

    .pill-orange {
      background-color: #ffd8b3;
      color: #7a3a00;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%7A3A00'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    }

    .pill-blue {
      background-color: #cce3eb;
      color: #1f5061;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%1F5061'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    }

    /* Input Styling */
    .text-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 19px;
      font-weight: 700;
      color: #000000;
      outline: none;
    }

    .text-input:focus {
      border-bottom: 2px solid #000000;
    }

    /* Currency Wrapper */
    .currency-wrap {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .currency-symbol {
      font-size: 19px;
      font-weight: 700;
      margin-right: 4px;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- Top Main Header Container -->
  <div class="main-header">
    <h1>Midnight Table Management Dashboard</h1>
    <div class="header-datetime" id="headerDateTime">Loading Date & Time...</div>
  </div>

  <!-- Regular Tables Section -->
  <div class="section-title">Standard Tables</div>
  <div class="tables-container" id="regularTablesContainer"></div>

  <!-- Special Tables Section -->
  <div class="section-title">Standing Tables</div>
  <div class="tables-container" id="specialTablesContainer"></div>

  <script>
    // Master Password configuration
    const MASTER_PASSWORD = "admin";
    
    // Store passwords dynamically: { tableId: "password" }
    const tablePasswords = {};

    // List of table names required
    const regularTables = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    const specialTables = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8', 'S9'];

    // Helper to generate a table component HTML string
    function renderTableCard(id) {
      return `
        <div class="card" id="card_${id}">
          <div class="top-header">
            <span>Table ${id}</span>
            <button class="lock-btn" id="lockBtn_${id}" onclick="toggleLock('${id}')" title="Click to Lock/Unlock">🔓 Lock</button>
          </div>
          <div class="subtitle-box" id="tableTitle_${id}">"Empty Table"</div>
          <div class="table-grid">
            
            <div class="grid-cell row-dark">Table</div>
            <div class="grid-cell row-dark">
              <select class="pill-select pill-red field-${id}" id="tableSelect_${id}" onchange="updateTitle('${id}')">
                <option value=' "Empty Table" ' selected>Empty</option>
                <option value=' "Company Table" '>Company</option>
                <option value=' "TW Table" '>TW Table</option>
                <option value=' "Nirmal Table" '>Nirmal Table</option>
                <option value=' "R/B Table" '>R/B</option>
              </select>
            </div>

            <div class="grid-cell row-light">Service</div>
            <div class="grid-cell row-light">
              <select class="pill-select pill-orange field-${id}">
                <option selected>None</option>
                <option>Anand</option>
                <option>Rohit</option>
                <option>Lalchand</option>
                <option>Laxman</option>
                <option>Mahesh</option>
                <option>Raj</option>
                <option>Bappi</option>
              </select>
            </div>

            <div class="grid-cell row-dark">Time</div>
            <div class="grid-cell row-dark">
              <input type="text" class="text-input field-${id}" value="00:00 AM" placeholder="e.g. 00:00 AM" />
            </div>

            <div class="grid-cell row-light">Status</div>
            <div class="grid-cell row-light">
              <select class="pill-select pill-blue field-${id}">
                <option selected>Empty</option>
                <option>Booked</option>
                <option>Seated</option>
                <option>Billed</option>
                <option>Cleaned</option>
              </select>
            </div>

            <div class="grid-cell row-dark">Bill</div>
            <div class="grid-cell row-dark">
              <div class="currency-wrap">
                <span class="currency-symbol">₹</span>
                <input type="number" class="text-input field-${id}" placeholder="0.00" min="0" step="1" />
              </div>
            </div>

            <div class="grid-cell row-light">Guest Name</div>
            <div class="grid-cell row-light">
              <input type="text" class="text-input field-${id}" placeholder="Enter guest name..." />
            </div>

          </div>
        </div>
      `;
    }

    // Populate containers with tables
    function populateTables(tablesArray, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = tablesArray.map(id => renderTableCard(id)).join('');
    }

    // Lock function
    function lockTable(id) {
      const fields = document.querySelectorAll(`.field-${id}`);
      fields.forEach(field => field.disabled = true);
      document.getElementById(`card_${id}`).classList.add('locked');
      const btn = document.getElementById(`lockBtn_${id}`);
      btn.textContent = '🔒 Locked';
      btn.style.backgroundColor = '#ffcccc';
    }

    // Unlock function
    function unlockTable(id) {
      const fields = document.querySelectorAll(`.field-${id}`);
      fields.forEach(field => field.disabled = false);
      document.getElementById(`card_${id}`).classList.remove('locked');
      const btn = document.getElementById(`lockBtn_${id}`);
      btn.textContent = '🔓 Lock';
      btn.style.backgroundColor = '#ffffff';
    }

    // Manual Lock/Unlock button click handler
    function toggleLock(id) {
      const isLocked = document.getElementById(`card_${id}`).classList.contains('locked');

      if (!isLocked) {
        // User wants to lock the card
        if (!tablePasswords[id]) {
          const pass = prompt(`Set a password for Table ${id}:`);
          if (pass) {
            tablePasswords[id] = pass;
            lockTable(id);
          }
        } else {
          lockTable(id);
        }
      } else {
        // User wants to unlock the card
        const inputPass = prompt(`Enter password to unlock Table ${id} (or enter Master Password):`);
        if (inputPass === tablePasswords[id] || inputPass === MASTER_PASSWORD) {
          unlockTable(id);
        } else if (inputPass !== null) {
          alert('Incorrect Password!');
        }
      }
    }

    // Update individual header text when dropdown changes
    function updateTitle(id) {
      const select = document.getElementById(`tableSelect_${id}`);
      const title = document.getElementById(`tableTitle_${id}`);
      title.textContent = select.value;
    }

    // Live Clock for Header
    function updateHeaderClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB'); // Format: DD/MM/YYYY
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      document.getElementById('headerDateTime').textContent = `${dateStr} | ${timeStr}`;
    }

    // Render all tables dynamically on load
    populateTables(regularTables, 'regularTablesContainer');
    populateTables(specialTables, 'specialTablesContainer');
    
    // Start page header live clock (updates every 1000ms)
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);
  </script>

  <script>
  // Checks if the HTML file on the server has changed
  let lastModified = null;
  
  async function checkForUpdates() {
    try {
      const response = await fetch(window.location.href, { method: 'HEAD' });
      const currentModified = response.headers.get('Last-Modified');
      
      if (lastModified && currentModified && lastModified !== currentModified) {
        // Reload page automatically when server file changes
        window.location.reload();
      } else {
        lastModified = currentModified;
      }
    } catch (err) {
      console.log('Error checking updates:', err);
    }
  }

  // Check every 10 seconds
  setInterval(checkForUpdates, 10000);
</script>

</body>
</html>
